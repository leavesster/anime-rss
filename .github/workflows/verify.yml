name: Verify

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.2"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 -m venv .venv
      - run: uv sync --locked --extra dev
      - run: npm --prefix web ci
      - run: make verify
      - run: make doctor
      - run: make security-scan

  external-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.2"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 -m venv .venv
      - run: uv sync --locked --extra dev
      - run: make acceptance-compose
      - run: make acceptance-qbittorrent
